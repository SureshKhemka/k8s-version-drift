# Default configuration (CF-1). Layered: defaults -> config/<DRIFT_ENV>.yaml -> DRIFT__SECTION__KEY env vars.
# Secrets never live here (CF-3): only the *names* of env vars that hold them.

llm:
  enabled: true
  providers:
    lmstudio:
      type: openai_compat
      base_url: http://127.0.0.1:1234/v1
      api_key_env: null
      json_mode: true
    ollama:
      type: openai_compat
      base_url: http://127.0.0.1:11434/v1
      api_key_env: null
      json_mode: true
    openrouter:
      type: openai_compat
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      json_mode: true
    anthropic:
      type: anthropic
      base_url: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY
  default:                      # CH-7: every step uses this unless overridden below
    provider: lmstudio
    model: qwen/qwen3.8-27b
    temperature: 0.2
    max_tokens: 4096
    timeout_s: 180
    retries: 1
    price_in_per_mtok: 0.0      # LL-5: local = free
    price_out_per_mtok: 0.0
  steps:
    group: {}
    draft: {}
    shorten: {}
    judge:                      # EV-12: judge configured separately from models under test
      model: google/gemma-4-31b
      temperature: 0.0

chain:
  max_themes: 5
  gate_retries: 2               # CH-6: retries after the first attempt

prompts:
  dir: prompts
  group: group_v1.md.j2
  draft: draft_v1.md.j2
  shorten: shorten_v1.md.j2
  judge: judge_v1.md.j2

sources:
  # The mock world writes the effective inventory for the current night here (drift mocks reset / night N).
  inventory: {type: file, path: var/mocks/inventory.yaml}
  matrix: {type: file, path: seed/matrix.yaml}

clusters:
  concurrency: 16
  timeout_s: 5
  retries: 2
  retry_backoff_s: 0.2
  time_budget_s: 60
  token_env: null               # mocks need no auth
  verify_tls: true
  endpoint_template: http://127.0.0.1:8081/clusters/{id}
  node_pool_labels:
    - eks.amazonaws.com/nodegroup
    - cloud.google.com/gke-nodepool
    - node.kubernetes.io/pool
  page_size: 100

policy:
  skew_max_minor: 3             # kubelet may be up to 3 minors older than the API server
  warning_window_days: 60
  patch_behind_threshold: 3
  worsened_days_thresholds: [30, 14, 7]
  severities:                   # FR-12; FR-13 floors enforced at startup
    CP_EOL:              {default: CRITICAL}
    CP_UNSUPPORTED:      {default: HIGH, overrides: {dev: MEDIUM}}
    CP_EOL_SOON:         {default: MEDIUM, overrides: {prod: HIGH, dev: LOW}}
    CP_UNKNOWN_VERSION:  {default: MEDIUM}
    CP_PATCH_BEHIND:     {default: LOW, overrides: {prod: MEDIUM}}
    NODE_SKEW_EXCEEDED:  {default: HIGH, overrides: {dev: MEDIUM}}
    NODE_NEWER_THAN_CP:  {default: HIGH}
    NODE_POOL_MIXED:     {default: MEDIUM, overrides: {dev: LOW}}
    NODE_EOL:            {default: HIGH, overrides: {prod: CRITICAL}}
    UNREACHABLE:         {default: HIGH, overrides: {dev: MEDIUM}}
    UNPARSEABLE_VERSION: {default: MEDIUM}

schedule:
  cron: "0 2 * * *"
  timezone: Asia/Kolkata

output:
  mode: DRY_RUN                 # FR-25
  outbox_dir: var/outbox
  post_retries: 3
  post_retry_backoff_s: 1.0
  post_timeout_s: 10

channel:
  type: slack_webhook
  webhook_url_env: DRIFT_CHANNEL_WEBHOOK_URL
  format: slack_mrkdwn
  max_length: 3000
  post_all_clear: true
  mentions:
    on_critical: ["<!subteam^S0PLATONCALL|platform-oncall>"]

deny_list:                      # CH-4 / EV-6
  - 'https?://'                 # any URL, incl. API server endpoints
  - '\b\d{12}\b'                # AWS account IDs
  - '(?i)\bbearer\s+[a-z0-9._-]+'
  - '(?i)\b(token|secret|password|api[_-]?key)\s*[:=]'
  - '\beyJ[A-Za-z0-9_-]{10,}'   # JWT-looking strings
  - '\b(sk|xox[abp])-[A-Za-z0-9-]{8,}'
  - '\.eks\.amazonaws\.com'
  - '\b\d{1,3}(\.\d{1,3}){3}\b' # IPv4 addresses

storage:
  db_path: var/drift.db
  runs_dir: var/runs
  retention_days: 90            # FR-33

mocks:
  k8s: {host: 127.0.0.1, port: 8081}
  channel: {host: 127.0.0.1, port: 8082}
  seed_dir: seed
  state_dir: var/mocks
  faults: seed/faults.yaml
  timeout_sleep_s: 30

logging:
  level: INFO
